[package]
name = "ender-minecraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Couche Minecraft : evenements de jeu et adaptateurs (simulation + Azalea 1.21.1)"

[features]
default = ["sim"]
sim = []
live = ["dep:azalea", "dep:anyhow", "dep:tracing", "dep:bevy_ecs"]

[dependencies]
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
azalea = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
